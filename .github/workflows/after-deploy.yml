name: After deploy (live check + IndexNow)
# One job after each push to main: waits once for the Cloudflare deploy, then checks the live pages
# and submits changed pages to IndexNow. Branch pushes are not deployed, so they are not checked here.
on:
  push:
    branches: [main]
    paths: ['site/**', 'worker/**', 'wrangler.jsonc', 'tools/live_urls.txt']
  workflow_dispatch:
concurrency:
  group: after-deploy
  cancel-in-progress: false   # each push must still submit its own changed pages
jobs:
  after-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Wait for the Cloudflare deploy
        run: sleep 180
      - name: Fetch changed pages (up to 6) and tools/live_urls.txt from the live site
        run: |
          { git diff --name-only HEAD~1 HEAD -- 'site/*.html' | head -6 | while read -r f; do
              p="/${f#site/}"; p="${p%.html}"; [ "$p" = "/index" ] && p="/"
              m=$(grep -o -m1 '<title>[^<]*</title>' "$f"); echo "$p $m"; done
            cat tools/live_urls.txt 2>/dev/null; } > /tmp/urls
          while read -r p want; do
            [ -z "$p" ] && continue
            r=$(curl -s -o /tmp/b -w '%{http_code} %{redirect_url}' "https://teslaservice.co.uk$p")
            hit=""; if [ -n "$want" ]; then grep -qF -- "$want" /tmp/b && hit="found" || hit="MISSING:$want"; fi
            echo "::notice title=live::$p -> $r $hit"
          done < /tmp/urls
      - name: Submit changed pages to IndexNow
        env:
          KEY: a1c797c468201b408b268a3855091834
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess, urllib.request
          b, a, key = os.environ['BEFORE'], os.environ['AFTER'], os.environ['KEY']
          rng = [b + '..' + a] if b and set(b) != {'0'} else [a + '~1..' + a]
          files = subprocess.run(['git', 'diff', '--name-only', '--diff-filter=AM', *rng, '--', 'site/*.html'], capture_output=True, text=True).stdout.split()
          urls = []
          for f in files:
              p = f[len('site/'):]
              if p in ('404.html',): continue
              if p == 'index.html': u = '/'
              elif p.endswith('/index.html'): u = '/' + p[:-10]
              else: u = '/' + p[:-5]
              urls.append('https://teslaservice.co.uk' + u)
          print(len(urls), 'changed pages')
          if not urls: raise SystemExit(0)
          for i in range(0, len(urls), 10000):
              body = json.dumps({'host': 'teslaservice.co.uk', 'key': key, 'keyLocation': f'https://teslaservice.co.uk/{key}.txt', 'urlList': urls[i:i + 10000]}).encode()
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
              try:
                  r = urllib.request.urlopen(req, timeout=30); print('::notice title=indexnow::HTTP', r.status, len(urls[i:i + 10000]), 'urls')
              except urllib.error.HTTPError as e:
                  print('::warning title=indexnow::HTTP', e.code, e.read()[:300]); raise SystemExit(1)
          PY
