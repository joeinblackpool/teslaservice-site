name: IndexNow full submit
# Manual only. Reads every live sitemap (sitemap.xml + the sitemap-places index and its parts) and submits
# every URL to IndexNow (Bing, Yandex, Seznam, Naver share it), 10,000 URLs per request.
# Use after a big launch or a sitemap rebuild; the "After deploy" workflow handles day-to-day changed pages.
on:
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Submit every sitemap URL to IndexNow
        env:
          KEY: a1c797c468201b408b268a3855091834
        run: |
          python3 - <<'PY'
          import os, re, json, time, urllib.request, urllib.error
          key, base = os.environ['KEY'], 'https://teslaservice.co.uk'
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'teslaservice-indexnow'}), timeout=60)
              return r.status, r.read().decode('utf-8', 'replace')
          s, k = get(f'{base}/{key}.txt')
          print('::notice title=key file::HTTP', s, 'matches' if k.strip() == key else 'MISMATCH')
          if k.strip() != key: raise SystemExit(1)
          todo, seen, urls = [f'{base}/sitemap.xml', f'{base}/sitemap-places.xml'], set(), []
          while todo:
              sm = todo.pop(0)
              if sm in seen: continue
              seen.add(sm)
              s, body = get(sm)
              locs = re.findall(r'<loc>([^<]+)</loc>', body)
              if '<sitemapindex' in body:
                  todo += locs; print('::notice title=sitemap index::', sm, 'HTTP', s, len(locs), 'sitemaps')
              else:
                  urls += locs; print('::notice title=sitemap::', sm, 'HTTP', s, len(locs), 'urls')
          urls = list(dict.fromkeys(u for u in urls if u.startswith(base)))
          print(len(urls), 'unique urls')
          ok = 0
          for i in range(0, len(urls), 10000):
              chunk = urls[i:i + 10000]
              body = json.dumps({'host': 'teslaservice.co.uk', 'key': key, 'keyLocation': f'{base}/{key}.txt', 'urlList': chunk}).encode()
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
              try:
                  r = urllib.request.urlopen(req, timeout=60); ok += len(chunk)
                  print('::notice title=indexnow::HTTP', r.status, len(chunk), 'urls')
              except urllib.error.HTTPError as e:
                  print('::warning title=indexnow::HTTP', e.code, e.read()[:300])
              time.sleep(2)
          print('::notice title=indexnow total::', ok, 'of', len(urls), 'urls accepted')
          if ok == 0: raise SystemExit(1)
          PY
