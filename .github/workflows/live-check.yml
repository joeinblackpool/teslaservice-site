name: Live check (after each push)
on: [push]
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which deploy secrets exist (names only)
        env: { A: "${{ secrets.CLOUDFLARE_API_TOKEN }}", B: "${{ secrets.CF_API_TOKEN }}", C: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
        run: echo "::notice title=secrets::CLOUDFLARE_API_TOKEN=${A:+set} CF_API_TOKEN=${B:+set} CLOUDFLARE_ACCOUNT_ID=${C:+set}"
      - run: sleep 180
      - name: Fetch the paths in tools/live_urls.txt from the live site
        run: |
          while read -r p want; do
            [ -z "$p" ] && continue
            r=$(curl -s -o /tmp/b -w '%{http_code} %{redirect_url}' "https://teslaservice.co.uk$p")
            hit=""; [ -n "$want" ] && grep -q -- "$want" /tmp/b && hit="found:$want"
            [ -n "$want" ] && [ -z "$hit" ] && hit="MISSING:$want"
            echo "::notice title=live::$p -> $r $hit"
          done < tools/live_urls.txt
